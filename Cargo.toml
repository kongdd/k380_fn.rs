[package]
name = "k380-fn-lock"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "setFnKeys"
path = "src/main.rs"

[[bin]]
name = "setMediaKeys"
path = "src/media.rs"

[dependencies]
hidapi = "2"

[target.'cfg(target_os = "macos")'.dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
